name = "jet-telemetry-api"
main = "src/index.js"
compatibility_date = "2026-11-25"

[[d1_databases]]
binding = "DB"
database_name = "jet-telemetry"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# For local development only. Set the production value with:
# npx wrangler secret put ADMIN_PIN
[vars]
ADMIN_PIN = "CHANGE_ME_USE_WRANGLER_SECRET_IN_PRODUCTION"
