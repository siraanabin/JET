<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#1B2430"/>
      <stop offset="1" stop-color="#0A0E13"/>
    </radialGradient>
    <radialGradient id="disc" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1A1A1A"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="label" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#FF5A1F"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="headphones" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27D7C5"/>
      <stop offset="0.48" stop-color="#6B7CFF"/>
      <stop offset="1" stop-color="#FF5E9C"/>
    </linearGradient>
    <clipPath id="discClip"><circle cx="50" cy="50" r="44"/></clipPath>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>

  <!-- Colorful headphone frame behind the record -->
  <path d="M15 53 V45 C15 12 85 12 85 45 V53"
        fill="none" stroke="#05080D" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <path d="M15 53 V45 C15 12 85 12 85 45 V53"
        fill="none" stroke="url(#headphones)" stroke-width="5" stroke-linecap="round"/>
  <rect x="9" y="45" width="13" height="23" rx="6.5" fill="#27D7C5"/>
  <rect x="78" y="45" width="13" height="23" rx="6.5" fill="#FF5E9C"/>
  <rect x="12" y="49" width="7" height="14" rx="3.5" fill="#B9FFF5" opacity="0.8"/>
  <rect x="81" y="49" width="7" height="14" rx="3.5" fill="#FFD0E2" opacity="0.8"/>

  <!-- Floating music notes and tiny sound accents -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <g fill="#FFD166" stroke="#FFD166">
      <path d="M27 9 V20 L23 22" fill="none" stroke-width="2.2"/>
      <circle cx="22.5" cy="22.5" r="2.7" stroke="none"/>
    </g>
    <g fill="#FF6B8A" stroke="#FF6B8A">
      <path d="M73 76 V87 L69 89" fill="none" stroke-width="2.2"/>
      <circle cx="68.5" cy="89.5" r="2.7" stroke="none"/>
    </g>
    <g fill="#55E6D0" stroke="#55E6D0">
      <path d="M76 10 V19 L72.5 21" fill="none" stroke-width="1.8"/>
      <circle cx="72" cy="21.5" r="2.2" stroke="none"/>
    </g>
    <g fill="#A78BFA" stroke="#A78BFA">
      <path d="M25 79 V87 L21.5 89" fill="none" stroke-width="1.8"/>
      <circle cx="21" cy="89.5" r="2.2" stroke="none"/>
    </g>
    <path d="M8 31 l2 3 3 1 -3 2 -2 3 -1.5 -3 -3 -2 3 -1z" fill="#FFD166" stroke="none"/>
    <path d="M91 29 l1.5 2.5 2.5 1.5 -2.5 1.5 -1.5 2.5 -1.5 -2.5 -2.5 -1.5 2.5 -1.5z" fill="#55E6D0" stroke="none"/>
    <circle cx="8" cy="75" r="1.4" fill="#FF6B8A" stroke="none"/>
    <circle cx="93" cy="77" r="1.5" fill="#A78BFA" stroke="none"/>
  </g>

  <circle cx="51.5" cy="53" r="38" fill="#000" opacity="0.48"/>
  <g transform="translate(50 50) scale(0.82) translate(-50 -50)">
    <circle cx="50" cy="50" r="44" fill="url(#disc)"/>
    <circle cx="50" cy="50" r="44" fill="none" stroke="#2A2F36" stroke-width="0.6"/>
    <g fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="0.25">
      <circle cx="50" cy="50" r="43"/>
      <circle cx="50" cy="50" r="41.8"/>
      <circle cx="50" cy="50" r="40.6"/>
    </g>
    <circle cx="50" cy="50" r="41.5" fill="none" stroke="#fff" stroke-opacity="0.15" stroke-width="0.35"/>
    <circle cx="50" cy="50" r="40" fill="url(#label)"/>
    <circle cx="50" cy="50" r="38" fill="#10151C"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="#FFB020" stroke-width="0.6" opacity="0.8"/>
    <g clip-path="url(#discClip)">
      <path d="M50 50 L20 -10 L55 -10 Z" fill="url(#sheen)"/>
      <path d="M50 50 L80 110 L45 110 Z" fill="url(#sheen)"/>
    </g>
  </g>
</svg>