name: Android Debug UI Build

on:
  push:
    branches:
      - feature/player-ui-debug
    paths:
      - '.github/workflows/android-build.yml'
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'version.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug and run Debug lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: |
          test -s ./gradle/wrapper/gradle-wrapper.jar
          chmod +x ./gradlew

      - name: Build debug and run lint
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JET-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
