name: Android Debug UI Build

on:
  push:
    branches:
      - feature/player-ui-debug
    paths:
      - '.github/workflows/android-build.yml'
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'version.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug and Release, run Debug lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: |
          test -s ./gradle/wrapper/gradle-wrapper.jar
          chmod +x ./gradlew

      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64}" ]; then
            printf '%s' "${KEYSTORE_B64}" | base64 --decode > app/jet-release.jks
            test -s app/jet-release.jks
            chmod 600 app/jet-release.jks
          else
            echo "::warning::Release keystore secret is not configured; assembleRelease may fail."
          fi

      - name: Build debug, release and lint
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease :app:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JET-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
