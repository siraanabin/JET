name: Build and Publish JET Debug APK

on:
  push:
    branches:
      - debug-video-size-network-fix
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jet-debug-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-debug:
    name: Build, sign and publish Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout debug branch
        uses: actions/checkout@v4
        with:
          ref: debug-video-size-network-fix

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download pinned offline UI assets
        run: |
          set -euo pipefail
          ASSETS="app/src/main/assets"
          mkdir -p "$ASSETS/js" "$ASSETS/css" "$ASSETS/fonts" "$ASSETS/licenses"

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js" \
            -o "$ASSETS/js/lucide.min.js"

          for weight in 400 500 600 700 800; do
            curl --fail --location --retry 3 --retry-delay 2 \
              "https://cdn.jsdelivr.net/npm/@fontsource/plus-jakarta-sans@5.1.0/files/plus-jakarta-sans-latin-\${weight}-normal.woff2" \
              -o "$ASSETS/fonts/plus-jakarta-sans-\${weight}.woff2"
          done

          cat > "$ASSETS/fonts/fonts.css" <<'CSS'
          @font-face {
            font-family: "Plus Jakarta Sans";
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url("./plus-jakarta-sans-400.woff2") format("woff2");
          }
          @font-face {
            font-family: "Plus Jakarta Sans";
            font-style: normal;
            font-weight: 500;
            font-display: swap;
            src: url("./plus-jakarta-sans-500.woff2") format("woff2");
          }
          @font-face {
            font-family: "Plus Jakarta Sans";
            font-style: normal;
            font-weight: 600;
            font-display: swap;
            src: url("./plus-jakarta-sans-600.woff2") format("woff2");
          }
          @font-face {
            font-family: "Plus Jakarta Sans";
            font-style: normal;
            font-weight: 700;
            font-display: swap;
            src: url("./plus-jakarta-sans-700.woff2") format("woff2");
          }
          @font-face {
            font-family: "Plus Jakarta Sans";
            font-style: normal;
            font-weight: 800;
            font-display: swap;
            src: url("./plus-jakarta-sans-800.woff2") format("woff2");
          }
          CSS

          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/tailwindlabs/tailwindcss/v3.4.17/LICENSE" \
            -o "$ASSETS/licenses/TAILWIND-MIT.txt"
          curl --fail --location --retry 3 \
            "https://cdn.jsdelivr.net/npm/lucide@0.460.0/LICENSE" \
            -o "$ASSETS/licenses/LUCIDE-ISC.txt"
          curl --fail --location --retry 3 \
            "https://cdn.jsdelivr.net/npm/@fontsource/plus-jakarta-sans@5.1.0/LICENSE" \
            -o "$ASSETS/licenses/PLUS-JAKARTA-SANS-OFL-1.1.txt"

          python3 - <<'PY'
          from pathlib import Path
          root = Path("app/src/main/assets")
          lucide = root / "js/lucide.min.js"
          assert lucide.stat().st_size > 10000, "Lucide UMD download looks incomplete"
          assert b"createIcons" in lucide.read_bytes(), "Downloaded Lucide file is not the expected UMD build"
          for p in sorted((root / "fonts").glob("*.woff2")):
              data = p.read_bytes()
              assert data[:4] == b"wOF2" and len(data) > 1000, f"Invalid WOFF2: {p}"
          for p in (root / "licenses").iterdir():
              assert p.stat().st_size > 100, f"Missing license text: {p}"
          print("Offline font, icon and license assets validated.")
          PY

      - name: Compile Tailwind CSS 3.4.17
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false tailwindcss@3.4.17
          npx tailwindcss@3.4.17 -c ./tailwind.config.js \
            -i ./input.css \
            -o ./app/src/main/assets/css/tailwind.min.css \
            --minify
          test -s app/src/main/assets/css/tailwind.min.css
          if grep -E 'cdn\\.tailwindcss|unpkg\\.com/lucide|fonts\\.googleapis' app/src/main/assets/index.html; then
            echo "A remote UI CDN reference remains in index.html" >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode release keystore for matching Debug signature
        env:
          KEYSTORE_B64: \${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "\${KEYSTORE_B64}" ]; then
            echo "::error::Missing keystore secret. Configure ANDROID_KEYSTORE_BASE64 (or KEYSTORE_BASE64)."
            exit 1
          fi
          printf '%s' "\${KEYSTORE_B64}" | base64 --decode > app/jet-release.jks
          test -s app/jet-release.jks
          chmod 600 app/jet-release.jks

      - name: Validate Debug version metadata
        id: version
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          v = json.loads(Path('version.json').read_text())
          g = Path('app/build.gradle.kts').read_text()
          code = int(re.search(r'versionCode\\s*=\\s*(\\d+)', g).group(1))
          name = re.search(r'versionName\\s*=\\s*"([^"]+)"', g).group(1)
          assert code == 404, code
          assert name == '3.9.14', name
          assert v['versionCode'] == code, (code, v['versionCode'])
          assert v['versionName'] == name, (name, v['versionName'])
          assert v['apkUrl'].endswith('/debug-v3.9.14/JET-debug.apk'), v['apkUrl']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"version_name={name}\\n")
              f.write(f"version_code={code}\\n")
              f.write("tag_name=debug-v3.9.14\\n")
          print(f"JET Debug {name} (versionCode {code})")
          PY

      - name: Make Gradle wrapper executable
        run: |
          test -s ./gradle/wrapper/gradle-wrapper.jar
          chmod +x ./gradlew

      - name: Build signed Debug APK with Release signing key
        env:
          ANDROID_KEYSTORE_PASSWORD: \${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: \${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: \${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Stage universal Debug APK
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/debug"
          test -d "$APK_DIR"
          APK="$(find "$APK_DIR" -maxdepth 1 -type f -name '*universal*debug*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            APK="$(find "$APK_DIR" -maxdepth 1 -type f -name 'app-debug.apk' -print -quit)"
          fi
          if [ -z "$APK" ]; then
            echo "::error::Could not find the universal Debug APK in $APK_DIR"
            find "$APK_DIR" -maxdepth 1 -type f -print
            exit 1
          fi
          cp "$APK" jet-debug-v3.9.14.apk
          cp "$APK" JET-debug.apk
          test -s jet-debug-v3.9.14.apk
          test -s JET-debug.apk
          ls -lh jet-debug-v3.9.14.apk JET-debug.apk

      - name: Upload versioned Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jet-debug-v3.9.14.apk
          path: jet-debug-v3.9.14.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish or update Debug pre-release
        uses: softprops/action-gh-release@v2
        with:
          token: \${{ secrets.GITHUB_TOKEN }}
          tag_name: debug-v3.9.14
          name: JET Debug v3.9.14
          target_commitish: \${{ github.sha }}
          files: JET-debug.apk
          overwrite_files: true
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false
          generate_release_notes: false
