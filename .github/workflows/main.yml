name: Build JET Android Debug APK

on:
  push:
    branches: [main, jet-v2-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Build JET Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project version metadata
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          v = json.loads(Path('version.json').read_text())
          g = Path('app/build.gradle.kts').read_text()
          code = int(re.search(r'versionCode\s*=\s*(\d+)', g).group(1))
          name = re.search(r'versionName\s*=\s*"([^"]+)"', g).group(1)
          assert code == v['versionCode'], (code, v['versionCode'])
          assert name == v['versionName'], (name, v['versionName'])
          print(f"JET {name} (versionCode {code})")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: |
          test -f ./gradlew
          test -f ./gradlew.bat
          test -s ./gradle/wrapper/gradle-wrapper.jar
          chmod +x ./gradlew

      - name: Build debug APK only
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JET-Android-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
