name: Build JET Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip & Prepare JET Project
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            for f in *.zip; do unzip -o "$f"; done
          fi
          if [ ! -f "settings.gradle.kts" ] && [ -f "JET-Android/settings.gradle.kts" ]; then
            cp -r JET-Android/* .
          fi
          python3 -c 'p="app/src/main/java/com/jet/downloader/MainActivity.kt"; s=open(p).read(); open(p,"w").write(s.replace("\\s","\\\\s"))'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          fi

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload JET APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JET-Android-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
