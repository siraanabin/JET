name: Build JET Android APK

on:
  push:
    branches: [main, jet-v2-integration]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build JET APKs
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preserve release Gradle configuration
        run: cp app/build.gradle.kts /tmp/JET-app-build.gradle.kts

      - name: Unpack and patch Android project
        run: |
          unzip -o JET-Android-GitHub.zip -d .
          cat JET-updater.patch.gz.b64.* | base64 -d | gzip -d > /tmp/JET-updater.patch
          git apply --check /tmp/JET-updater.patch
          git apply /tmp/JET-updater.patch
          cp /tmp/JET-app-build.gradle.kts app/build.gradle.kts

      - name: Verify project version metadata
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          v = json.loads(Path('version.json').read_text())
          g = Path('app/build.gradle.kts').read_text()
          code = int(re.search(r'versionCode\\s*=\\s*(\\d+)', g).group(1))
          name = re.search(r'versionName\\s*=\\s*"([^"]+)"', g).group(1)
          assert code == v['versionCode'], (code, v['versionCode'])
          assert name == v['versionName'], (name, v['versionName'])
          print(f"JET {name} (versionCode {code})")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare release signing keystore
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::ANDROID_KEY_ALIAS secret is missing"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::ANDROID_KEYSTORE_PASSWORD secret is missing"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::ANDROID_KEY_PASSWORD secret is missing"; exit 1; }
          mkdir -p app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/jet-release.jks
          test -s app/jet-release.jks

      - name: Make Gradle wrapper executable
        run: |
          test -f ./gradlew
          test -f ./gradlew.bat
          test -s ./gradle/wrapper/gradle-wrapper.jar
          chmod +x ./gradlew

      - name: Build debug and signed release APKs
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Remove release keystore
        if: always()
        run: rm -f app/jet-release.jks

      - name: Prepare release APK
        run: cp app/build/outputs/apk/release/app-release.apk JET-release.apk

      - name: Package updated Android source
        run: zip -qr JET-Android-GitHub-updated.zip app gradle gradlew gradlew.bat build.gradle.kts gradle.properties settings.gradle.kts version.json

      - name: Upload updated source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: JET-Android-Updated-Source
          path: JET-Android-GitHub-updated.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JET-Android-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: JET-Android-Release-APK
          path: JET-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: JET ${{ github.ref_name }}
          files: JET-release.apk
          generate_release_notes: true
