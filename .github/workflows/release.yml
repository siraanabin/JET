name: Build and Publish JET Release APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'version.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jet-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build, sign and publish Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "::error::Missing keystore secret. Configure ANDROID_KEYSTORE_BASE64 (or KEYSTORE_BASE64)."
            exit 1
          fi
          printf '%s' "${KEYSTORE_B64}" | base64 --decode > app/jet-release.jks
          test -s app/jet-release.jks
          chmod 600 app/jet-release.jks

      - name: Validate version metadata
        id: version
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          v = json.loads(Path('version.json').read_text())
          g = Path('app/build.gradle.kts').read_text()
          code = int(re.search(r'versionCode\\s*=\\s*(\\d+)', g).group(1))
          name = re.search(r'versionName\\s*=\\s*"([^"]+)"', g).group(1)
          assert code == v['versionCode'], (code, v['versionCode'])
          assert name == v['versionName'], (name, v['versionName'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"version_name={name}\\n")
              f.write(f"version_code={code}\\n")
          print(f"JET {name} (versionCode {code})")
          PY

      - name: Make Gradle wrapper executable
        run: |
          test -s ./gradle/wrapper/gradle-wrapper.jar
          chmod +x ./gradlew

      - name: Build signed Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify signed APK exists
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: JET v${{ steps.version.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          files: app/build/outputs/apk/release/app-release.apk
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
          generate_release_notes: true
